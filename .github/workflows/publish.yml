name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { version } = require("./package.json");
          const lock = require("./package-lock.json");
          assert.match(version, /^\d+\.\d+\.\d+$/, "Only stable versions can be published here.");
          assert.equal(process.env.RELEASE_TAG, `v${version}`, "Release tag must match package.json.");
          assert.equal(lock.version, version, "package-lock.json must have the same version.");
          NODE
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm pack --dry-run
      - name: Publish with trusted publishing
        run: npm publish --access public --provenance
